name: Debug scrape structure

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dateutil

      - name: Run scraper (dry run, no commit)
        run: |
          python scraper.py
          echo "----- talks.json summary -----"
          python3 -c "
import json
d = json.load(open('talks.json'))
print('total_talks:', d['total_talks'])
for t in d['talks'][:15]:
    print('---')
    print('title:', t['title'])
    print('date:', t['date'])
    print('speaker:', t['speaker'])
    print('description:', t['description'])
    print('disciplines:', t['disciplines'])
"
